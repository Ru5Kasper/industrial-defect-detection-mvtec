experiment_name: patchcore_pilot
seed: 42
dataset:
  root: data/mvtec_ad
  categories: [bottle, cable, carpet]
  image_size: 256
model:
  name: patchcore
  coreset_ratio: 0.001
  max_bank_size: 5000
  nn_chunk_size: 2048
  pretrained: true
training:
  batch_size: 2
  num_workers: 0
  device: auto
  artifacts_dir: artifacts/patchcore
evaluation:
  batch_size: 1
  num_workers: 0
  results_dir: results
  save_visualizations: true
  aupro_max_fpr: 0.30
  aupro_thresholds: 300
